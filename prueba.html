<!doctype html>
<html lang="es">
<head>
    <p>Nuevo cambio</p>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bienvenida</title>
    <style>
        :root{--bg:#f5f7fb;--card:#fff;--accent:#4f46e5;--muted:#6b7280}
        *{box-sizing:border-box}
        body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;background:linear-gradient(180deg,var(--bg),#fff);color:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .card{background:var(--card);max-width:720px;border-radius:12px;padding:32px;box-shadow:0 6px 24px rgba(15,23,42,0.08);text-align:center}
        h1{margin:0 0 8px;font-size:clamp(1.4rem,2.6vw,2rem);color:var(--accent)}
        p{margin:0 0 20px;color:var(--muted)}
        .cta{display:inline-block;padding:10px 18px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
        .meta{margin-top:18px;font-size:0.9rem;color:var(--muted)}
        footer{margin-top:22px;font-size:0.8rem;color:var(--muted)}
    </style>
</head>
<body>
    <main class="card" role="main">
        <h1 id="greeting">¡Bienvenido!</h1>
        <p>Gracias por visitar esta página de prueba. Aquí puedes comenzar tu proyecto.</p>
        <a href="#" class="cta" id="startBtn">Comenzar</a>
        <div class="meta" id="timeInfo"></div>
        <footer>Prueba — página simple de bienvenida</footer>
    </main>

    <script>
        // Mensaje dinámico según la hora del día
        const greetingEl = document.getElementById('greeting');
        const timeInfo = document.getElementById('timeInfo');
        const hour = new Date().getHours();
        let saludo = '¡Bienvenido!';
        if (hour >= 5 && hour < 12) saludo = '¡Buenos días!';
        else if (hour >= 12 && hour < 18) saludo = '¡Buenas tardes!';
        else saludo = '¡Buenas noches!';
        greetingEl.textContent = saludo;

        // Acción del botón (ejemplo: desplazar a contenido o mostrar alerta)
        document.getElementById('startBtn').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Aquí puedes añadir enlaces a tu contenido o iniciar la aplicación.');
        });

        // Mostrar hora local simple
        const now = new Date();
        timeInfo.textContent = 'Hora local: ' + now.toLocaleTimeString();
    </script>
</body>
</html>
